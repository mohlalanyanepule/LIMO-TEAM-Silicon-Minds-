<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LIMO Simulator — Silicon Minds</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header>
    <h1>LIMO Simulator</h1>
    <span class="badge">Silicon Minds · CS3520</span>
  </header>

  <main>
    <section class="panel editor-panel">
      <h2>Editor</h2>
      <textarea id="editor" spellcheck="false" placeholder="Type LIMO assembly here...

eketsa-haufi x5, lefela, 10
eketsa-haufi x6, lefela, 20
eketsa x7, x5, x6"></textarea>
      <div class="controls">
        <button id="assemble">Assemble</button>
        <button id="load-example">Load Example</button>
      </div>
    </section>

    <section class="panel output-panel">
      <h2>Machine Code</h2>
      <table id="output">
        <thead>
          <tr><th>Address</th><th>Hex</th><th>Binary</th><th>Source</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="panel simulator-panel">
      <h2>Datapath</h2>
      <div class="controls">
        <button id="load" title="Assemble the editor contents and load them into the pipeline">Load</button>
        <button id="step" title="Advance the pipeline by one cycle" aria-label="Step one cycle">Step</button>
        <button id="run" title="Run until the program halts" aria-label="Run">Run</button>
        <button id="pause" title="Pause after the current cycle" aria-label="Pause">Pause</button>
        <button id="reset" title="Clear the registers, memory and pipeline" aria-label="Reset">Reset</button>
      </div>
      <p id="status" class="status" role="status">Load a program to start.</p>
      <div id="stages" class="stages">
        <div class="stage"><h3>IF</h3><div class="stage-body"></div></div>
        <div class="stage"><h3>ID</h3><div class="stage-body"></div></div>
        <div class="stage"><h3>EX</h3><div class="stage-body"></div></div>
        <div class="stage"><h3>MEM</h3><div class="stage-body"></div></div>
        <div class="stage"><h3>WB</h3><div class="stage-body"></div></div>
      </div>
    </section>

    <section class="panel signals-panel">
      <h2>Control Signals</h2>
      <table id="signals">
        <tbody></tbody>
      </table>
    </section>

    <section class="panel state-panel">
      <h2>Registers &amp; Memory</h2>
      <div class="state-columns">
        <table id="registers" class="registers">
          <thead><tr><th>Register</th><th>Value</th></tr></thead>
          <tbody></tbody>
        </table>
        <table id="memory" class="memory">
          <thead><tr><th>Address</th><th>Value</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section class="panel stats-panel">
      <h2>Statistics</h2>
      <dl id="stats" class="stats"></dl>
    </section>
  </main>

  <footer>
    <p>LIMO — a Sesotho-language processor derived from RISC-V RV32I</p>
  </footer>

  <script type="module" src="./main.js"></script>
</body>
</html>
