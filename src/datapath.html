<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIMO Pipeline Datapath Simulator</title>
    <style>
        /* CSS STYLING */
        body {
            background-color: #1e1e1e;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007acc;
            color: white;
            border: none;
            border-radius: 4px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #005f9e;
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        /* The main container for the drawing */
        #datapath-container {
            position: relative;
            width: 1000px;
            height: 600px;
            background-color: #252526;
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
        }

        /* SVG Wires Layer */
        #wires-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Hardware Boxes (ALU, Memory, etc.) */
        .hardware-box {
            position: absolute;
            background-color: #3c3c3c;
            border: 2px solid #555;
            color: #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: monospace;
            font-size: 14px;
            border-radius: 4px;
            z-index: 2;
            transition: all 0.3s ease;
        }

        /* Pipeline Registers (Vertical Lines) */
        .pipeline-register {
            position: absolute;
            width: 30px;
            height: 80%;
            top: 10%;
            background-color: rgba(255, 255, 255, 0.1);
            border-left: 2px solid #888;
            border-right: 2px solid #888;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            color: #888;
            font-size: 12px;
            font-weight: bold;
        }

        /* Wires */
        .wire {
            stroke: #555;
            stroke-width: 3;
            transition: stroke 0.3s, stroke-width 0.3s;
        }

        /* Active States (Highlighted) */
        .wire.active {
            stroke: #00ff00;
            stroke-width: 4;
            filter: drop-shadow(0 0 5px #00ff00);
        }

        .hardware-box.active {
            border-color: #00ff00;
            background-color: #2a4a2a;
            color: #00ff00;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }

        /* Live Data Labels */
        .wire-label {
            position: absolute;
            background-color: #000;
            color: #00ff00;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: monospace;
            font-size: 12px;
            z-index: 3;
            opacity: 0;
            transition: opacity 0.3s;
            border: 1px solid #00ff00;
        }

        .wire-label.active {
            opacity: 1;
        }
    </style>
</head>
<body>

    <h1>LIMO Datapath Simulator</h1>

    <div class="controls">
        <button id="step-btn">Step (Next Cycle)</button>
        <button id="reset-btn">Reset</button>
    </div>

    <div id="datapath-container">
        <!-- SVG Layer for Wires -->
        <svg id="wires-layer">
            <!-- PC to Instruction Memory -->
            <path id="w-pc-im" class="wire" d="M 80 100 L 160 100" fill="none"/>
            
            <!-- Instruction Memory to IF/ID -->
            <path id="w-im-ifid" class="wire" d="M 280 100 L 330 100" fill="none"/>
            
            <!-- IF/ID to Register File -->
            <path id="w-ifid-rf" class="wire" d="M 360 100 L 410 150" fill="none"/>
            
            <!-- Register File to ID/EX (Top path) -->
            <path id="w-rf-idex" class="wire" d="M 570 150 L 630 150" fill="none"/>
            
            <!-- ID/EX to ALU -->
            <path id="w-idex-alu" class="wire" d="M 660 150 L 750 200" fill="none"/>
            
            <!-- ALU to EX/MEM -->
            <path id="w-alu-exmem" class="wire" d="M 830 250 L 900 250" fill="none"/>
            
            <!-- EX/MEM to Data Memory -->
            <path id="w-exmem-dm" class="wire" d="M 930 250 L 930 350" fill="none"/>
            
            <!-- Data Memory to MEM/WB -->
            <path id="w-dm-memwb" class="wire" d="M 930 450 L 930 500 L 630 500" fill="none"/>
            
            <!-- MEM/WB back to Register File (Write Back) -->
            <path id="w-memwb-rf" class="wire" d="M 600 500 L 490 500 L 490 250" fill="none"/>
        </svg>

        <!-- Hardware Units -->
        <div id="pc" class="hardware-box" style="left: 30px; top: 80px; width: 50px; height: 40px;">PC</div>
        <div id="im" class="hardware-box" style="left: 160px; top: 60px; width: 120px; height: 80px;">Instruction<br>Memory</div>
        <div id="rf" class="hardware-box" style="left: 410px; top: 110px; width: 160px; height: 100px;">Register File</div>
        <div id="alu" class="hardware-box" style="left: 750px; top: 200px; width: 80px; height: 50px;">ALU</div>
        <div id="dm" class="hardware-box" style="left: 850px; top: 350px; width: 160px; height: 100px;">Data Memory</div>

        <!-- Pipeline Registers -->
        <div id="ifid-reg" class="pipeline-register" style="left: 310px;">IF/ID</div>
        <div id="idex-reg" class="pipeline-register" style="left: 610px;">ID/EX</div>
        <div id="exmem-reg" class="pipeline-register" style="left: 880px;">EX/MEM</div>
        <div id="memwb-reg" class="pipeline-register" style="left: 610px;">MEM/WB</div>

        <!-- Live Data Labels (Hidden by default) -->
        <div id="l-pc-im" class="wire-label" style="left: 90px; top: 75px;">0x0000</div>
        <div id="l-idex-alu" class="wire-label" style="left: 690px; top: 150px;">0x0000</div>
        <div id="l-alu-exmem" class="wire-label" style="left: 840px; top: 220px;">0x0000</div>
        <div id="l-memwb-rf" class="wire-label" style="left: 520px; top: 460px;">0x0000</div>
    </div>

    <script>
        // JAVASCRIPT LOGIC
        let currentCycle = 0;
        const stepBtn = document.getElementById('step-btn');
        const resetBtn = document.getElementById('reset-btn');

        // Define the sequence of stages for our demo
        const stages = ['IF', 'ID', 'EX', 'MEM', 'WB'];
        let currentStageIndex = 0;

        function clearHighlights() {
            // Remove active class from all wires, boxes, and labels
            document.querySelectorAll('.wire').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.hardware-box').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.wire-label').forEach(el => el.classList.remove('active'));
        }

        function simulateStep() {
            clearHighlights();
            
            let stage = stages[currentStageIndex];
            let fakeDataValue = "0x" + (Math.floor(Math.random() * 255) + 1).toString(16).toUpperCase().padStart(8, '0');

            // Logic to highlight based on the current stage
            if (stage === 'IF') {
                document.getElementById('pc').classList.add('active');
                document.getElementById('im').classList.add('active');
                document.getElementById('w-pc-im').classList.add('active');
                
                let label = document.getElementById('l-pc-im');
                label.innerText = "PC: 0x" + (currentCycle * 4).toString(16).toUpperCase().padStart(4, '0');
                label.classList.add('active');
            } 
            else if (stage === 'ID') {
                document.getElementById('rf').classList.add('active');
                document.getElementById('w-ifid-rf').classList.add('active');
            } 
            else if (stage === 'EX') {
                document.getElementById('alu').classList.add('active');
                document.getElementById('w-idex-alu').classList.add('active');
                document.getElementById('w-alu-exmem').classList.add('active');

                let label = document.getElementById('l-idex-alu');
                label.innerText = "Input: " + fakeDataValue;
                label.classList.add('active');
            } 
            else if (stage === 'MEM') {
                document.getElementById('dm').classList.add('active');
                document.getElementById('w-exmem-dm').classList.add('active');
            } 
            else if (stage === 'WB') {
                document.getElementById('rf').classList.add('active');
                document.getElementById('w-memwb-rf').classList.add('active');

                let label = document.getElementById('l-memwb-rf');
                label.innerText = "Write: " + fakeDataValue;
                label.classList.add('active');
            }

            // Advance to next stage
            currentStageIndex++;
            if (currentStageIndex >= stages.length) {
                currentStageIndex = 0; // Loop back to start
                currentCycle++;
            }
        }

        function resetSimulation() {
            clearHighlights();
            currentCycle = 0;
            currentStageIndex = 0;
        }

        // Attach events to buttons
        stepBtn.addEventListener('click', simulateStep);
        resetBtn.addEventListener('click', resetSimulation);
    </script>
</body>
</html>
